name: Build distributables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-python:
    name: Linux Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source archive
        run: python -m build
      - name: Verify wheel metadata and entry points
        run: |
          python -m pip install --no-deps dist/*.whl
          openusbip-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: openusbip-linux-python
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows-client:
    name: Windows desktop executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.3"
      - name: Build Windows client
        run: pyinstaller --noconfirm packaging/windows/openusbip-client.spec
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/OpenUSBIP/OpenUSBIP.exe")) {
            throw "PyInstaller did not produce OpenUSBIP.exe"
          }
          Compress-Archive -Path "dist/OpenUSBIP/*" -DestinationPath "dist/OpenUSBIP-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: openusbip-windows-x64
          path: dist/OpenUSBIP-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android server APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests and build APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: openusbip-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
